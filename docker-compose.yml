services:
  xtremflow:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xtremflow
    ports:
      - "8089:8089"
    volumes:
      - xtremflow-data:/app/data
      # Configuration du répertoire d'enregistrement TV
      # Par défaut: sauve dans ./data/recordings (dossier local)
      # Pour changer: modifiez le chemin avant les deux points ":"
      # Exemple Windows : - D:\MesVideos\TV:/app/recordings
      # Exemple Linux   : - /mnt/nas/videos:/app/recordings
      - ${RECORDINGS_PATH:-./data/recordings}:/app/recordings
    environment:
      # Fuseau horaire du conteneur (affichage des logs ; les enregistrements
      # sont stockés en UTC quoi qu'il arrive)
      - TZ=${TZ:-Europe/Paris}
      # Origine externe autorisée pour CORS (optionnel — l'app est servie
      # same-origin, ne définir que si un autre domaine doit appeler l'API)
      - ALLOWED_ORIGIN=${ALLOWED_ORIGIN:-}
      # Nombre max d'enregistrements TV simultanés (FFmpeg -c copy, peu de CPU)
      - MAX_CONCURRENT_RECORDINGS=${MAX_CONCURRENT_RECORDINGS:-2}
      # Source XMLTV de repli, interrogée uniquement quand le panneau ne rend
      # aucun programme couvrant l'instant présent. Vider la variable coupe
      # tout appel sortant : l'EPG se limite alors au panneau de l'abonné.
      # Plusieurs dumps se séparent par des virgules.
      - EPG_XMLTV_URLS=${EPG_XMLTV_URLS-https://epgshare01.online/epgshare01/epg_ripper_FR1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_CH1.xml.gz,https://epgshare01.online/epgshare01/epg_ripper_BE2.xml.gz}
      # Accélération GPU NVIDIA pour le transcodage (NVENC) : true/false
      - NVIDIA_GPU=${NVIDIA_GPU:-false}
      # UID/GID du serveur, à aligner sur le propriétaire du dossier
      # d'enregistrement (Unraid : 99/100). Vides = utilisateur interne.
      - PUID=${PUID:-}
      - PGID=${PGID:-}
      # Reverse proxy devant XtremFlow : IP ou plage CIDR du proxy dont
      # X-Forwarded-For est honoré (ex. 172.18.0.0/16). Vide = aucun : l'IP
      # vue est celle de la connexion (rate limit par IP du proxy).
      - TRUSTED_PROXIES=${TRUSTED_PROXIES:-}
      # Hôtes du réseau local que le proxy d'images/API et les captures
      # peuvent joindre malgré l'anti-SSRF (panneau IPTV sur le LAN), séparés
      # par des virgules. Vide = adresses privées toujours refusées.
      - PROXY_ALLOW_PRIVATE_HOSTS=${PROXY_ALLOW_PRIVATE_HOSTS:-}
    restart: unless-stopped

volumes:
  xtremflow-data:
