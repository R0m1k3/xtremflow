<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>XtremFlow Player</title>
    <!--
      Les libs hls.js / mpegts.js ne sont PLUS chargées depuis un CDN ni de
      façon bloquante : xf-player-core.js ne récupère que celle réellement
      nécessaire au flux courant, en local. Deux requêtes bloquantes en moins
      et environ 200 Ko de JS jamais téléchargés dans le cas courant.
    -->
    <link rel="stylesheet" href="xf-player.css">
    <link rel="preload" href="vendor/hls.min.js" as="script">
</head>

<body>
    <div id="player-container">
        <video id="video" autoplay playsinline webkit-playsinline preload="auto"></video>

        <div id="play-overlay">
            <svg viewBox="0 0 24 24">
                <path d="M8 5v14l11-7z" />
            </svg>
        </div>

        <div id="loading" class="xf-center">
            <div class="xf-leader">
                <div class="xf-leader-cross"></div>
            </div>
            <div class="xf-label" id="loading-text">Ouverture du flux</div>
            <div class="xf-hint" id="loading-hint"></div>
        </div>

        <div id="error" class="xf-center">
            <div class="xf-error-mark">!</div>
            <div class="xf-error-title" id="error-message">Erreur de chargement</div>
            <div class="xf-error-sub">Vérifiez le lien ou votre connexion</div>
        </div>
    </div>

    <script src="xf-player-core.js"></script>
    <script>
        (function () {
            var video = document.getElementById('video');
            var loading = document.getElementById('loading');
            var loadingText = document.getElementById('loading-text');
            var loadingHint = document.getElementById('loading-hint');
            var errorBox = document.getElementById('error');
            var errorMessage = document.getElementById('error-message');
            var playOverlay = document.getElementById('play-overlay');

            function showLoading(msg) {
                loading.style.display = 'block';
                loadingText.textContent = msg || 'Ouverture du flux';
                errorBox.style.display = 'none';
            }

            function hideLoading() {
                loading.style.display = 'none';
                loadingHint.textContent = '';
            }

            function showError(msg) {
                hideLoading();
                errorBox.style.display = 'block';
                errorMessage.textContent = msg || 'Erreur de chargement';
                playOverlay.style.display = 'none';
            }

            var player = new XFPlayer({
                video: video,
                logPrefix: '[Player]',
                onLoading: showLoading,
                onReady: function () {
                    hideLoading();
                    playOverlay.style.display = 'none';
                },
                onError: showError,
                onBlocked: function () {
                    hideLoading();
                    playOverlay.style.display = 'flex';
                },
                onProfileChange: function (name) {
                    // Retour visuel discret : l'utilisateur comprend pourquoi
                    // la latence augmente légèrement après des coupures.
                    loadingHint.textContent =
                        name === 'safe' ? 'Réseau instable — buffer maximal'
                                        : 'Réseau instable — buffer élargi';
                }
            });

            playOverlay.addEventListener('click', function () {
                video.play();
                playOverlay.style.display = 'none';
            });

            player.start();
            window.xfPlayer = player;
        })();
    </script>
</body>

</html>
