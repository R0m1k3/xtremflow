[package]
name = "xtremflow-server"
version = "0.1.0"
edition = "2024"
description = "Serveur XtremFlow : API, proxy Xtream, streaming FFmpeg, enregistrements TV"
publish = false

[dependencies]
async-stream = "0.3.6"
axum = "0.8.9"
base64 = "0.22"
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = "0.4.45"
flate2 = "1.1.10"
futures = "0.3.34"
libc = "0.2.190"
md-5 = "0.10"
mime_guess = "2.0.5"
percent-encoding = "2.3.2"
quick-xml = "0.37"
regex = "1.13.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.53.2", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
url = "2.5.8"
uuid = { version = "1.28.0", features = ["v4"] }

[profile.release]
lto = "thin"
strip = true
